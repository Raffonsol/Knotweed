<!DOCTYPE html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <link rel="apple-touch-icon" href="https://aurbano.eu/assets/files/touch-icon.png">
    <link rel="apple-touch-icon" sizes="72x72" href="https://aurbano.eu/assets/files/touch-icon-72.png">
    <link rel="apple-touch-icon" sizes="114x114" href="https://aurbano.eu/assets/files/touch-icon-114.png">

    <title>Knotweed</title>

</head>
<style type="text/css">
    body {
        margin: 0;
        padding: 0;
        background: #000;
        position: relative;
        color: #FFF;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    a {
        color: inherit;
        text-decoration: none;
    }

    a:hover {
        text-decoration: underline;
    }

    .rectangle {
        height: 7px;
        width: 80px;
        color: #555;
        border-top: 15px solid #555;
    }

    .trapezoid {
        border-top: 50px solid #555;
        border-left: 15px solid transparent;
        border-right: 15px solid transparent;
        color: #555;
        height: 0;
        width: 35px;
    }

    .pot {
        margin: auto;
        margin-top: -5px;
        display: block;
    }

    .cube {

        width: 250px;
        height: 300%;
        display: inline-block;
        border: 1px solid white;
        /*background-color: #0099FF;*/
    }

    .planter-row {
        display: flex;
        justify-content: flex-start;
        align-items: center;
        gap: 8px;
        min-height: 24px;
    }

    .plantMenu {
        right: 0;
        float: right;
        display: inline-block;
        width: 250px;
        height: 100%;
        position: fixed;
        background: cadetblue;

    }
    #gameBox {
        display: flex;
        flex-direction: row;
        width: 70%;
        flex-wrap: wrap;
        justify-content: flex-start;
    }
    #inventory {
        border: 1px solid green;
        margin-bottom: 5px;
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
    }
    #inventory > button {
        min-width: 50%;
        background-color: #8bf;
        border:2px solid green;
        border-radius: 5px;
    }
    .shop {
        border: 1px solid green;
        background-color: rgb(102, 59, 36);
        margin-top: 5px;
        display: flex;
        flex-direction: column;
    }
    .shop > button {
        width: 70%;
        background-color: #8bf;
        border:2px solid green;
        border-radius: 5px;
    }
    .seed-offer {
        display: flex;
        align-items: center;
        gap: 4px;
        width: 100%;
    }
    .seed-offer > button:first-child {
        flex: 1;
        background-color: #8bf;
        border: 2px solid green;
        border-radius: 5px;
    }
    .favorite-button {
        width: 28px;
        padding: 0;
        color: #777;
        background: transparent;
        border: 0;
        font-size: 18px;
        cursor: pointer;
    }
    .favorite-button:hover {
        color: #d9c86c;
    }
    .favorite-button.active {
        color: #ffd700;
    }
</style>

<body>
<div class="plantMenu">
    Money: $<span id="money"></span>
    <br>
    <br>
    <div> INVENTORY
        <div id="inventory"></div>
    </div>
    <br>
    <div> SHOP
        <label><input type="checkbox" id="autoPlant"> (auto-plant)</label>
        <div id="seedShop" class="shop"></div>
        <div id="potShop" class="shop"></div>
        <div id="upgradeShop" class="shop"></div>
    </div>
</div>

<div id="gameBox"></div>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.6.5/dat.gui.min.js"></script>
<script type="text/javascript" src="src/TreeGenerator.js"></script>
<script type="text/javascript" src="src/GameOverlord.js"></script>
<script type="text/javascript" src="src/seeds.js"></script>
<script type="text/javascript">
    $(document).ready(function () {
        preGame();
    });
</script>

</body>
